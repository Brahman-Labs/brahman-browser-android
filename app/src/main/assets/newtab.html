<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Tab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #050E1F 0%, #0A2A4A 50%, #0D3D6B 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        /* Animated water bubbles */
        .bubbles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            border-radius: 50%;
            background: rgba(0, 180, 216, 0.08);
            border: 1px solid rgba(0, 180, 216, 0.15);
            animation: rise linear infinite;
        }

        .bubble:nth-child(1)  { width: 40px;  height: 40px;  left: 10%; animation-duration: 8s;  animation-delay: 0s; }
        .bubble:nth-child(2)  { width: 20px;  height: 20px;  left: 20%; animation-duration: 5s;  animation-delay: 1s; }
        .bubble:nth-child(3)  { width: 60px;  height: 60px;  left: 35%; animation-duration: 10s; animation-delay: 2s; }
        .bubble:nth-child(4)  { width: 30px;  height: 30px;  left: 50%; animation-duration: 7s;  animation-delay: 0.5s; }
        .bubble:nth-child(5)  { width: 15px;  height: 15px;  left: 65%; animation-duration: 6s;  animation-delay: 3s; }
        .bubble:nth-child(6)  { width: 50px;  height: 50px;  left: 80%; animation-duration: 9s;  animation-delay: 1.5s; }
        .bubble:nth-child(7)  { width: 25px;  height: 25px;  left: 90%; animation-duration: 5s;  animation-delay: 2.5s; }

        @keyframes rise {
            0%   { bottom: -100px; opacity: 0; transform: translateX(0); }
            10%  { opacity: 1; }
            90%  { opacity: 0.5; }
            100% { bottom: 110vh; opacity: 0; transform: translateX(30px); }
        }

        /* Main content */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 40px;
            min-height: 100vh;
        }

        /* Logo & Branding */
        .logo-section {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #00B4D8, #0096C7);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(0, 180, 216, 0.4);
            font-size: 36px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #CAF0F8, #00B4D8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-tagline {
            font-size: 13px;
            color: rgba(202, 240, 248, 0.6);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* DateTime */
        .datetime {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease 0.1s both;
        }

        .time {
            font-size: 48px;
            font-weight: 200;
            letter-spacing: -1px;
            color: #CAF0F8;
        }

        .date {
            font-size: 14px;
            color: rgba(202, 240, 248, 0.6);
            margin-top: 4px;
        }

        /* Search Bar */
        .search-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 32px;
            padding: 0 20px;
            height: 56px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            background: rgba(255,255,255,0.18);
            border-color: #00B4D8;
            box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.2);
        }

        .search-icon {
            font-size: 18px;
            margin-right: 12px;
            opacity: 0.7;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: rgba(202, 240, 248, 0.5);
        }

        .search-engines {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }

        .engine-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: rgba(202, 240, 248, 0.8);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .engine-btn.active {
            background: rgba(0, 180, 216, 0.3);
            border-color: #00B4D8;
            color: #CAF0F8;
        }

        /* Quick Links */
        .quick-links {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .section-title {
            font-size: 12px;
            color: rgba(202, 240, 248, 0.5);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
            text-align: center;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .quick-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .quick-link:active {
            transform: scale(0.94);
            background: rgba(0, 180, 216, 0.2);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .link-name {
            font-size: 11px;
            color: rgba(202, 240, 248, 0.8);
            text-align: center;
        }

        /* Wave divider */
        .wave-divider {
            width: 100%;
            margin: 32px 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,180,216,0.3), transparent);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            color: rgba(202, 240, 248, 0.3);
            font-size: 11px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }
    </style>
</head>
<body>

<div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="container">

    <!-- Logo -->
    <div class="logo-section">
        <div class="logo-icon">🌊</div>
        <div class="brand-name">Brahman Browser</div>
        <div class="brand-tagline">by Brahman Labs</div>
    </div>

    <!-- Date & Time -->
    <div class="datetime">
        <div class="time" id="clock">00:00</div>
        <div class="date" id="dateDisplay"></div>
    </div>

    <!-- Search -->
    <div class="search-section">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input
                class="search-input"
                type="text"
                id="searchInput"
                placeholder="Search or enter URL..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"/>
        </div>
        <div class="search-engines">
            <button class="engine-btn active" onclick="setEngine('google')">Google</button>
            <button class="engine-btn" onclick="setEngine('bing')">Bing</button>
            <button class="engine-btn" onclick="setEngine('duckduckgo')">DuckDuckGo</button>
        </div>
    </div>

    <div class="wave-divider"></div>

    <!-- Quick Links -->
    <div class="quick-links">
        <div class="section-title">Quick Access</div>
        <div class="links-grid">
            <a class="quick-link" onclick="navigate('https://www.youtube.com')">
                <div class="link-icon" style="background:rgba(255,0,0,0.15)">▶️</div>
                <span class="link-name">YouTube</span>
            </a>
            <a class="quick-link" onclick="navigate('https://github.com')">
                <div class="link-icon" style="background:rgba(255,255,255,0.1)">💻</div>
                <span class="link-name">GitHub</span>
            </a>
            <a class="quick-link" onclick="navigate('https://www.reddit.com')">
                <div class="link-icon" style="background:rgba(255,69,0,0.15)">🗨️</div>
                <span class="link-name">Reddit</span>
            </a>
            <a class="quick-link" onclick="navigate('https://twitter.com')">
                <div class="link-icon" style="background:rgba(29,161,242,0.15)">🐦</div>
                <span class="link-name">Twitter</span>
            </a>
            <a class="quick-link" onclick="navigate('https://www.wikipedia.org')">
                <div class="link-icon" style="background:rgba(255,255,255,0.1)">📖</div>
                <span class="link-name">Wikipedia</span>
            </a>
            <a class="quick-link" onclick="navigate('https://www.instagram.com')">
                <div class="link-icon" style="background:rgba(225,48,108,0.15)">📸</div>
                <span class="link-name">Instagram</span>
            </a>
            <a class="quick-link" onclick="navigate('https://www.amazon.in')">
                <div class="link-icon" style="background:rgba(255,153,0,0.15)">🛍️</div>
                <span class="link-name">Amazon</span>
            </a>
            <a class="quick-link" onclick="navigate('https://chat.openai.com')">
                <div class="link-icon" style="background:rgba(0,180,216,0.15)">🤖</div>
                <span class="link-name">ChatGPT</span>
            </a>
        </div>
    </div>

    <div class="footer">
        Brahman Browser • Private & Secure 🔒
    </div>

</div>

<script>
    // Clock
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = h + ':' + m;

        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        document.getElementById('dateDisplay').textContent =
            days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Search engine
    let currentEngine = 'google';
    const engines = {
        google: 'https://www.google.com/search?q=',
        bing: 'https://www.bing.com/search?q=',
        duckduckgo: 'https://duckduckgo.com/?q='
    };

    function setEngine(engine) {
        currentEngine = engine;
        document.querySelectorAll('.engine-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    }

    // Search on Enter
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const query = this.value.trim();
            if (!query) return;
            let url;
            if (query.startsWith('http://') || query.startsWith('https://')) {
                url = query;
            } else if (query.includes('.') && !query.includes(' ')) {
                url = 'https://' + query;
            } else {
                url = engines[currentEngine] + encodeURIComponent(query);
            }
            navigate(url);
        }
    });

    // Navigate via Android bridge
    function navigate(url) {
        if (window.BrahmanBridge) {
            window.BrahmanBridge.loadUrl(url);
        } else {
            window.location.href = url;
        }
    }

    // Auto focus search
    window.onload = function() {
        setTimeout(() => document.getElementById('searchInput').focus(), 300);
    };
</script>
</body>
</html>
