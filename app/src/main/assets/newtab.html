<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #050E1F 0%, #0A2A4A 50%, #0D3D6B 100%);
    min-height: 100vh;
    font-family: -apple-system, sans-serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 20px;
  }
  .logo {
    color: #00B4D8;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(0,180,216,0.5);
  }
  .tagline {
    color: #4090A0;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .search-container {
    width: 100%;
    max-width: 480px;
    position: relative;
    margin-bottom: 10px;
  }
  .search-box {
    width: 100%;
    padding: 14px 50px 14px 18px;
    border-radius: 28px;
    border: 1.5px solid rgba(0,180,216,0.4);
    background: rgba(10,42,74,0.8);
    color: #CAF0F8;
    font-size: 16px;
    outline: none;
    backdrop-filter: blur(10px);
  }
  .search-box::placeholder { color: rgba(202,240,248,0.4); }
  .search-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #00B4D8;
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }
  .engine-row {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }
  .engine-btn {
    padding: 6px 14px;
    border-radius: 16px;
    border: 1px solid rgba(0,180,216,0.3);
    background: rgba(10,42,74,0.5);
    color: rgba(202,240,248,0.6);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .engine-btn.active, .engine-btn:active {
    background: rgba(0,180,216,0.2);
    color: #00B4D8;
    border-color: #00B4D8;
  }

  /* Frequent Sites */
  #top-sites {
    width: 100%;
    max-width: 480px;
    display: none;
    margin-bottom: 24px;
  }
  .section-label {
    color: rgba(144,224,239,0.5);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-left: 4px;
  }
  #top-sites-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .site-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,180,216,0.15);
    border-radius: 14px;
    padding: 12px 6px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .site-card:active {
    background: rgba(0,180,216,0.2);
    border-color: rgba(0,180,216,0.5);
    transform: scale(0.95);
  }
  .site-letter {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0A2A4A, #0D3D6B);
    border: 1.5px solid rgba(0,180,216,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 6px;
    font-size: 16px;
    font-weight: 700;
    color: #00B4D8;
  }
  .site-domain {
    color: #90E0EF;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }

  /* Quick actions */
  .quick-actions {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .quick-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,180,216,0.15);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    color: #90E0EF;
    font-size: 11px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .quick-btn:active {
    background: rgba(0,180,216,0.2);
    transform: scale(0.95);
  }
  .quick-icon { font-size: 22px; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="logo">BRAHMAN</div>
<div class="tagline">Browser</div>

<div class="search-container">
  <input class="search-box" id="searchInput" type="text"
    placeholder="Search or type URL..."
    autocomplete="off" autocorrect="off"
    onkeydown="if(event.key==='Enter') doSearch()"/>
  <button class="search-btn" onclick="doSearch()">⌕</button>
</div>

<div class="engine-row">
  <button class="engine-btn" id="btn-google" onclick="setEngine('google')">Google</button>
  <button class="engine-btn" id="btn-duckduckgo" onclick="setEngine('duckduckgo')">DuckDuckGo</button>
  <button class="engine-btn" id="btn-bing" onclick="setEngine('bing')">Bing</button>
</div>

<!-- Frequent Sites -->
<div id="top-sites">
  <div class="section-label">Frequent</div>
  <div id="top-sites-grid"></div>
</div>

<!-- Quick Actions -->
<div class="quick-actions">
  <div class="quick-btn" onclick="window.BrahmanBridge.loadUrl('https://google.com')">
    <div class="quick-icon">🔍</div>Google
  </div>
  <div class="quick-btn" onclick="window.BrahmanBridge.loadUrl('https://youtube.com')">
    <div class="quick-icon">▶️</div>YouTube
  </div>
  <div class="quick-btn" onclick="window.BrahmanBridge.loadUrl('https://github.com')">
    <div class="quick-icon">💻</div>GitHub
  </div>
</div>

<script>
var currentEngine = 'google';

function init() {
  try {
    var eng = window.BrahmanBridge.getSearchEngine();
    setEngine(eng);
  } catch(e) {}
  document.getElementById('searchInput').focus();
}

function setEngine(engine) {
  currentEngine = engine;
  document.querySelectorAll('.engine-btn').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('btn-' + engine);
  if (btn) btn.classList.add('active');
}

function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  var url;
  if (q.startsWith('http://') || q.startsWith('https://')) {
    url = q;
  } else if (q.indexOf('.') !== -1 && q.indexOf(' ') === -1) {
    url = 'https://' + q;
  } else {
    var encoded = q.replace(/ /g, '+');
    if (currentEngine === 'bing') url = 'https://www.bing.com/search?q=' + encoded;
    else if (currentEngine === 'duckduckgo') url = 'https://duckduckgo.com/?q=' + encoded;
    else url = 'https://www.google.com/search?q=' + encoded;
  }
  try { window.BrahmanBridge.loadUrl(url); } catch(e) {}
}

function brahmanSetFrequent(jsonStr) {
  try {
    var sites = JSON.parse(jsonStr);
    if (!sites || sites.length === 0) return;
    var grid = document.getElementById('top-sites-grid');
    var container = document.getElementById('top-sites');
    grid.innerHTML = '';
    sites.forEach(function(site) {
      var card = document.createElement('div');
      card.className = 'site-card';
      card.innerHTML =
        '<div class="site-letter">' + site.letter + '</div>' +
        '<div class="site-domain">' + site.domain + '</div>';
      card.onclick = (function(u){ return function(){ window.BrahmanBridge.loadUrl(u); }; })(site.url);
      grid.appendChild(card);
    });
    container.style.display = 'block';
  } catch(e) {}
}

window.onload = init;
document.getElementById('searchInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
